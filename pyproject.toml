[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skifer-snowflake"
version = "0.1.0.dev0"
description = "Skifer connector for Snowflake: execution, catalog and publication contracts, no business logic."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julien Houbart", email = "houbartjulien80@gmail.com" }]
keywords = ["skifer", "Snowflake", "data-engineering", "declarative", "yaml", "sql"]
requires-python = ">=3.10"
# The language, IR, SQL compiler and connector contracts live in skifer today.
# When skifer-core is published as its own distribution, this line becomes
# "skifer-core>=X" and nothing else in this package changes.
dependencies = [
    "skifer>=4.1.0",
    "snowflake-connector-python>=3.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/morzu117/skifer-snowflake"
Repository = "https://github.com/morzu117/skifer-snowflake"
Changelog = "https://github.com/morzu117/skifer-snowflake/blob/main/CHANGELOG.md"
"Skifer" = "https://github.com/morzu117/skifer"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
